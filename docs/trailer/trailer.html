<!doctype html>
<html><head><meta charset="utf-8"><title>Luxas trailer</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// Deterministic frame renderer: renderFrame(f) draws frame f; no clocks, seeded randomness.
const W = 1280, H = 720, FPS = 24, N = 2400;
const MORPH = 1.15, DELAY = 0.45;

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(20261026);
const R = () => rng();
function gauss() { let u = 0; while (u === 0) u = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * R()); }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const ease = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
function fade(t, a, b, c, d) { if (t <= a || t >= d) return 0; if (t < b) return smooth((t - a) / (b - a)); if (t <= c) return 1; return 1 - smooth((t - c) / (d - c)); }
function perm(n, seed) { const r = mulberry32(seed); const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const COL = {
  amber: [255, 183, 94], cyan: [104, 212, 255], ice: [196, 226, 255], white: [242, 249, 255],
  stone: [222, 196, 156], dim: [120, 150, 196], green: [150, 240, 190],
};
function setC(o, c, a) { o.r = c[0]; o.g = c[1]; o.b = c[2]; if (a !== undefined) o.a = a; }
function mixC(o, c1, c2, p) { o.r = lerp(c1[0], c2[0], p); o.g = lerp(c1[1], c2[1], p); o.b = lerp(c1[2], c2[2], p); }
function bez(p0, p1, p2, p3, u) { const v = 1 - u; return [v*v*v*p0[0] + 3*v*v*u*p1[0] + 3*v*u*u*p2[0] + u*u*u*p3[0], v*v*v*p0[1] + 3*v*v*u*p1[1] + 3*v*u*u*p2[1] + u*u*u*p3[1]]; }

// per-particle constants
const DEL = new Float32Array(N), SW = new Float32Array(N), TW = new Float32Array(N), PH = new Float32Array(N), U0 = new Float32Array(N), J1 = new Float32Array(N), J2 = new Float32Array(N), SZ = new Float32Array(N);
for (let i = 0; i < N; i++) { DEL[i] = DELAY * R(); SW[i] = (R() - .5) * .6; TW[i] = 1 + 3 * R(); PH[i] = 6.283 * R(); U0[i] = R(); J1[i] = gauss(); J2[i] = gauss(); SZ[i] = .75 + .9 * R() * R(); }

// sample points evenly along a set of segments
function segSampler(segs) {
  const lens = segs.map(s => Math.hypot(s[2] - s[0], s[3] - s[1]));
  const tot = lens.reduce((a, b) => a + b, 0);
  return () => { let x = R() * tot; for (let k = 0; k < segs.length; k++) { if (x <= lens[k]) { const u = x / lens[k], s = segs[k]; return [lerp(s[0], s[2], u), lerp(s[1], s[3], u), k]; } x -= lens[k]; } const s = segs[segs.length - 1]; return [s[2], s[3], segs.length - 1]; };
}

// ---------- shape 0: Sisyphus' boulder rolling up the hill ----------
const PEAK = [640, 352], FOOT = [40, 700];
const SLOPE = (() => { const dx = PEAK[0] - FOOT[0], dy = PEAK[1] - FOOT[1], L = Math.hypot(dx, dy); return { dx: dx / L, dy: dy / L, L, nx: dy / L, ny: -dx / L }; })();
const RB = 46;
const boulder = (() => {
  const ox = new Float32Array(N), oy = new Float32Array(N), a = new Float32Array(N);
  for (let i = 0; i < N; i++) { const rim = R() < .14; const r = rim ? RB + R() * 6 : RB * Math.pow(R(), .42); const th = 6.283 * R(); ox[i] = r * Math.cos(th); oy[i] = r * Math.sin(th); a[i] = rim ? .1 : .09 + .26 * R() * R() + (R() < .06 ? .3 : 0); }
  const T = 2.6, s0 = 120;
  function travel(lt) { const p = clamp(lt / T); return s0 + (SLOPE.L - s0) * (ease(p) * .92 + p * .08) - 7 * Math.sin(lt * 6.5) * Math.sin(Math.PI * p); }
  return {
    get(i, lt, o) {
      const s = travel(lt);
      const cx = FOOT[0] + SLOPE.dx * s + SLOPE.nx * RB, cy = FOOT[1] + SLOPE.dy * s + SLOPE.ny * RB;
      const ang = s / RB;
      const c = Math.cos(ang), sn = Math.sin(ang);
      const rx = ox[i] * c - oy[i] * sn, ry = ox[i] * sn + oy[i] * c; o.x = cx + rx; o.y = cy + ry;
      const lit = .35 + .65 * clamp(.5 + .55 * (rx * .55 - ry * .83) / RB);
      setC(o, COL.stone, a[i] * lit); o.s = SZ[i] * .9;
    }
  };
})();

// ---------- shape 1: the question as a point of light with an orbit ----------
const SC = [640, 292];
const star = (() => {
  const kind = new Uint8Array(N), ox = new Float32Array(N), oy = new Float32Array(N), th = new Float32Array(N), rr = new Float32Array(N);
  const P = perm(N, 11);
  for (let j = 0; j < N; j++) { const i = P[j], f = j / N;
    if (f < .42) { kind[i] = 0; ox[i] = gauss() * 6; oy[i] = gauss() * 6; }
    else if (f < .62) { kind[i] = 1; rr[i] = 10 + Math.min(150, -Math.log(1 - R() * .999) * 28); th[i] = 6.283 * R(); }
    else { kind[i] = 2; th[i] = 6.283 * R(); rr[i] = gauss() * 2.2; }
  }
  const tilt = -0.32, ct = Math.cos(tilt), st = Math.sin(tilt);
  return {
    get(i, lt, o) {
      o.s = SZ[i];
      if (kind[i] === 0) { o.x = SC[0] + ox[i]; o.y = SC[1] + oy[i]; setC(o, COL.white, .55); }
      else if (kind[i] === 1) { const a = th[i] + lt * .12; o.x = SC[0] + rr[i] * Math.cos(a); o.y = SC[1] + rr[i] * Math.sin(a); setC(o, COL.ice, .3 * (1 - rr[i] / 175)); }
      else { const a = th[i] + lt * 1.25; const ex = (124 + rr[i]) * Math.cos(a), ey = (30 + rr[i] * .5) * Math.sin(a);
        o.x = SC[0] + ex * ct - ey * st; o.y = SC[1] + ex * st + ey * ct; setC(o, COL.cyan, .18 + .42 * (.5 + .5 * Math.sin(a))); }
    }
  };
})();

// ---------- shape 2: the brain decomposes the question ----------
const BR = [390, 205], KIDS = [[180, 470], [320, 470], [460, 470], [600, 470]];
const brain = (() => {
  const kind = new Uint8Array(N), kid = new Uint8Array(N), ox = new Float32Array(N), oy = new Float32Array(N), up = new Uint8Array(N);
  const P = perm(N, 22);
  for (let j = 0; j < N; j++) { const i = P[j], f = j / N; kid[i] = j % 4;
    if (f < .27) { kind[i] = 0; const r = 32 * Math.pow(R(), .55), t = 6.283 * R(); ox[i] = r * Math.cos(t); oy[i] = r * Math.sin(t); }
    else if (f < .63) { kind[i] = 1; up[i] = R() < .28 ? 1 : 0; ox[i] = gauss() * 1.6; }
    else { kind[i] = 2; const r = 15 * Math.pow(R(), .5), t = 6.283 * R(); ox[i] = r * Math.cos(t); oy[i] = r * Math.sin(t); }
  }
  const curves = KIDS.map(k => { const p0 = [BR[0], BR[1] + 36], p3 = [k[0], k[1] - 19], my = (p0[1] + p3[1]) / 2; return [p0, [p0[0], my], [p3[0], my], p3]; });
  return {
    curves,
    get(i, lt, o) {
      const k = kid[i]; o.s = SZ[i];
      const appear = smooth((lt - (.55 + .22 * k)) / .45);
      if (kind[i] === 0) { const br = 1 + .04 * Math.sin(lt * 3); o.x = BR[0] + ox[i] * br; o.y = BR[1] + oy[i] * br; setC(o, COL.amber, .5); }
      else if (kind[i] === 1) { let u = (U0[i] + lt * .42) % 1; if (up[i]) u = 1 - u; const c = curves[k]; const p = bez(c[0], c[1], c[2], c[3], u);
        o.x = p[0] + ox[i]; o.y = p[1]; setC(o, up[i] ? COL.amber : COL.ice, (.12 + .5 * Math.sin(Math.PI * u)) * appear); }
      else { o.x = KIDS[k][0] + ox[i]; o.y = KIDS[k][1] + oy[i]; setC(o, k === 0 ? COL.ice : COL.cyan, .5 * (.25 + .75 * appear)); }
    }
  };
})();

// ---------- shape 3: code and tests written blind to each other ----------
const D3 = [390, 140], LB = [250, 330], RBk = [530, 330], K3 = [390, 522];
function codeLines(cx, cy, seed) { const r = mulberry32(seed); const segs = []; const ind = [0, 12, 24, 24, 12, 0, 12]; for (let l = 0; l < 7; l++) { const y = cy - 39 + l * 13, x0 = cx - 62 + ind[l], len = 34 + r() * (100 - ind[l] - 30); segs.push([x0, y, x0 + len, y]); } return segs; }
const blind = (() => {
  const kind = new Uint8Array(N), side = new Uint8Array(N), px = new Float32Array(N), py = new Float32Array(N), cx = new Float32Array(N), cy = new Float32Array(N), cd = new Float32Array(N);
  const P = perm(N, 33);
  const sL = segSampler(codeLines(LB[0], LB[1], 5)), sR = segSampler(codeLines(RBk[0], RBk[1], 9));
  const tick = segSampler([[K3[0] - 34, K3[1] - 2, K3[0] - 10, K3[1] + 21], [K3[0] - 10, K3[1] + 21, K3[0] + 36, K3[1] - 28]]);
  for (let j = 0; j < N; j++) { const i = P[j], f = j / N; side[i] = j % 2;
    if (f < .07) { kind[i] = 0; const r = 10 * Math.pow(R(), .5), t = 6.283 * R(); px[i] = D3[0] + r * Math.cos(t); py[i] = D3[1] + r * Math.sin(t); }
    else if (f < .2) { kind[i] = 1; }
    else if (f < .64) { kind[i] = 2; const p = (side[i] ? sR : sL)(); px[i] = p[0] + R() * .6; py[i] = p[1] + gauss() * 1.1; }
    else if (f < .78) { kind[i] = 3; }
    else { kind[i] = 4; const p = tick(); cx[i] = p[0] + gauss() * 1.6; cy[i] = p[1] + gauss() * 1.6; cd[i] = R() * .35; }
  }
  const top = [LB, RBk].map(b => [D3, [D3[0], D3[1] + 70], [b[0], b[1] - 110], [b[0], b[1] - 48]]);
  const bot = [LB, RBk].map(b => [[b[0], b[1] + 46], [b[0], b[1] + 120], [K3[0], K3[1] - 90], [K3[0], K3[1] - 6]]);
  return {
    top, bot,
    get(i, lt, o) {
      o.s = SZ[i]; const sd = side[i];
      const col = sd ? COL.cyan : COL.amber;
      if (kind[i] === 0) { o.x = px[i]; o.y = py[i]; setC(o, COL.white, .55); }
      else if (kind[i] === 1) { const u = (U0[i] + lt * .5) % 1; const c = top[sd]; const p = bez(c[0], c[1], c[2], c[3], u); o.x = p[0] + J1[i] * 1.4; o.y = p[1]; mixC(o, COL.white, col, u); o.a = .1 + .45 * Math.sin(Math.PI * u); }
      else if (kind[i] === 2) { o.x = px[i]; o.y = py[i]; setC(o, col, .55 + .2 * Math.sin(lt * 2 + PH[i])); }
      else {
        const u = (U0[i] + lt * .5) % 1; const c = bot[sd]; const p = bez(c[0], c[1], c[2], c[3], u);
        let x = p[0] + J1[i] * 1.4, y = p[1], a = .1 + .45 * Math.sin(Math.PI * u);
        if (kind[i] === 4) { const q = ease((lt - 2.05 - cd[i]) / .65); x = lerp(x, cx[i], q); y = lerp(y, cy[i], q); a = lerp(a, .7, q); mixC(o, col, COL.green, q); }
        else setC(o, col);
        o.x = x; o.y = y; o.a = a;
      }
    }
  };
})();

// ---------- shape 4: every headline number estimated twice ----------
const AX = { x0: 150, x1: 630, y: 470 };
const B1 = { mu: 410, sg: 33, h: 205 }, B2 = { mu: 388, sg: 54, h: 150 };
const fb = (b, x) => b.h * Math.exp(-((x - b.mu) ** 2) / (2 * b.sg * b.sg));
const claim = (() => {
  const kind = new Uint8Array(N), px = new Float32Array(N), fr = new Float32Array(N), onc = new Uint8Array(N);
  const P = perm(N, 44);
  for (let j = 0; j < N; j++) { const i = P[j], f = j / N;
    if (f < .1) { kind[i] = 0; px[i] = lerp(AX.x0, AX.x1, R()); }
    else if (f < .9) { const b = f < .5 ? B1 : B2; kind[i] = f < .5 ? 1 : 2; onc[i] = R() < .6 ? 1 : 0;
      px[i] = onc[i] ? b.mu + (R() * 2 - 1) * 3.3 * b.sg : b.mu + gauss() * b.sg; fr[i] = onc[i] ? 1 : R(); }
    else { kind[i] = 3; px[i] = 400 + gauss() * 34; fr[i] = R(); }
  }
  return {
    get(i, lt, o) {
      o.s = SZ[i];
      if (kind[i] === 0) { o.x = px[i]; o.y = AX.y + J1[i] * .7; setC(o, COL.dim, .4); return; }
      if (kind[i] === 3) { const g = Math.min(fb(B1, px[i]), fb(B2, px[i])); o.x = px[i]; o.y = AX.y - fr[i] * g; setC(o, COL.white, .28 * smooth((lt - 2.55) / .6)); return; }
      const b = kind[i] === 1 ? B1 : B2, t0 = kind[i] === 1 ? .55 : 1.55, g = easeOut((lt - t0) / .95);
      o.x = px[i] + (onc[i] ? 0 : J1[i] * .5); o.y = AX.y - fr[i] * fb(b, px[i]) * g;
      setC(o, kind[i] === 1 ? COL.amber : COL.cyan, (onc[i] ? .62 : .2) * (.15 + .85 * g));
    }
  };
})();

// ---------- shape 5: the report page ----------
const PG = { x0: 232, y0: 118, x1: 552, y1: 548 };
const report = (() => {
  const px = new Float32Array(N), py = new Float32Array(N), pa = new Float32Array(N), pc = []; const r = mulberry32(55);
  const outline = segSampler([[PG.x0, PG.y0, PG.x1, PG.y0], [PG.x1, PG.y0, PG.x1, PG.y1], [PG.x1, PG.y1, PG.x0, PG.y1], [PG.x0, PG.y1, PG.x0, PG.y0]]);
  const title = segSampler([[292, 146, 492, 146], [322, 160, 462, 160]]);
  const abs = segSampler([[352, 176, 432, 176], [262, 194, 522, 194], [262, 203, 522, 203], [262, 212, 522, 212], [262, 221, 460, 221]]);
  const body = []; const FIG = { x0: 400, y0: 238, x1: 532, y1: 326 };
  for (const [x0, x1] of [[252, 384], [400, 532]]) { for (let y = 240; y <= 536; y += 9) {
    if (x0 === 400 && y < FIG.y1 + 8) continue; if (x0 === 252 && y > 378 && y < 404) continue;
    const short = r() < .14; body.push([x0, y, short ? x0 + 30 + r() * 70 : x1 - r() * 6, y]); } }
  const bodyS = segSampler(body);
  const box = segSampler([[FIG.x0, FIG.y0, FIG.x1, FIG.y0], [FIG.x1, FIG.y0, FIG.x1, FIG.y1], [FIG.x1, FIG.y1, FIG.x0, FIG.y1], [FIG.x0, FIG.y1, FIG.x0, FIG.y0]]);
  const curve = x => FIG.y1 - 10 - 64 * Math.exp(-(x - 408) / 30);
  const eq = segSampler([[268, 391, 300, 391], [306, 386, 312, 396], [318, 391, 352, 391], [358, 391, 368, 391]]);
  const P = perm(N, 55);
  for (let j = 0; j < N; j++) { const i = P[j], f = j / N; let p, c = COL.ice, a = .45;
    if (f < .13) { p = outline(); a = .6; }
    else if (f < .2) { p = title(); c = COL.white; a = .75; p[1] += gauss() * 1.3; }
    else if (f < .28) { p = abs(); a = .46; }
    else if (f < .7) { p = bodyS(); a = .42; }
    else if (f < .76) { p = box(); a = .4; }
    else if (f < .84) { const x = lerp(408, 528, r()); p = [x, curve(x) + gauss() * .8]; c = COL.cyan; a = .7; }
    else if (f < .91) { const x = lerp(410, 526, Math.floor(r() * 12) / 11); p = [x + gauss() * 1.4, curve(x) + gauss() * 1.4 + (r() - .5) * 6]; c = COL.amber; a = .7; }
    else { p = eq(); c = COL.white; a = .55; p[1] += gauss() * 1.2; }
    px[i] = p[0]; py[i] = p[1]; pa[i] = a; pc[i] = c;
  }
  return { get(i, lt, o) { o.x = px[i]; o.y = py[i]; setC(o, pc[i], pa[i]); o.s = SZ[i] * .85; } };
})();

// ---------- shape 6: the wordmark ----------
const MARK = { x: 640, y: 318, font: '200 168px "Avenir Next"', ls: 40 };
let mark = null;
function buildMark() {
  const oc = document.createElement('canvas'); oc.width = W; oc.height = H; const c = oc.getContext('2d');
  c.font = MARK.font; c.letterSpacing = MARK.ls + 'px'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff';
  c.fillText('LUXAS', MARK.x + MARK.ls / 2, MARK.y);
  const d = c.getImageData(0, 0, W, H).data; const pts = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3] > 110) pts.push([x, y]);
  const P = perm(pts.length, 66); const px = new Float32Array(N), py = new Float32Array(N);
  for (let i = 0; i < N; i++) { const p = pts[P[i % pts.length]]; px[i] = p[0] + (R() - .5); py[i] = p[1] + (R() - .5); }
  const xmin = Math.min(...px), xmax = Math.max(...px);
  mark = { get(i, lt, o) { o.x = px[i] + Math.sin(lt * 1.3 + PH[i]) * .5; o.y = py[i]; const u = (px[i] - xmin) / (xmax - xmin);
    mixC(o, COL.cyan, COL.white, clamp(u * 2)); if (u > .5) mixC(o, COL.white, COL.amber, (u - .5) * 2 * .7); o.a = .55 * (1 - .55 * smooth((lt - 1.6) / 1.0)); o.s = SZ[i] * .9; } };
}

// ---------- timeline ----------
const SCENES = [
  { t0: 0.0, shape: () => boulder, trail: .012 },
  { t0: 2.85, shape: () => star },
  { t0: 6.3, shape: () => brain },
  { t0: 10.8, shape: () => blind },
  { t0: 15.4, shape: () => claim },
  { t0: 20.0, shape: () => report },
  { t0: 24.4, shape: () => mark },
];
const TOTAL = 28.8;
SCENES.forEach((s, k) => { s.t1 = k + 1 < SCENES.length ? SCENES[k + 1].t0 : TOTAL; s.dur = s.t1 - s.t0; });
const DUR = k => SCENES[k].dur;
const FRAMES = Math.round(TOTAL * FPS);
function sceneAt(t) { let k = 0; while (k + 1 < SCENES.length && t >= SCENES[k + 1].t0) k++; return k; }

const tmp = {};
function particle(i, t, o) {
  const k = sceneAt(t), S = SCENES[k], lt = t - S.t0;
  S.shape().get(i, lt, o);
  if (k === 0) return;
  const q = (lt - DEL[i]) / MORPH; if (q >= 1) return;
  const Pv = SCENES[k - 1]; Pv.shape().get(i, t - Pv.t0, tmp);
  const p = ease(q); const dx = o.x - tmp.x, dy = o.y - tmp.y, sw = SW[i] * Math.sin(Math.PI * p);
  o.x = tmp.x + dx * p - dy * sw; o.y = tmp.y + dy * p + dx * sw;
  o.r = lerp(tmp.r, o.r, p); o.g = lerp(tmp.g, o.g, p); o.b = lerp(tmp.b, o.b, p);
  o.a = lerp(tmp.a, o.a, p) * (1 + .7 * Math.sin(Math.PI * p)); o.s = lerp(tmp.s, o.s, p);
}

// ---------- drawing ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const layer = document.createElement('canvas'); layer.width = W; layer.height = H; const lctx = layer.getContext('2d');
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
(() => { const b = bg.getContext('2d'); const g = b.createRadialGradient(W * .5, H * .44, 30, W * .5, H * .5, W * .72);
  g.addColorStop(0, '#0d1626'); g.addColorStop(.55, '#070c17'); g.addColorStop(1, '#020409'); b.fillStyle = g; b.fillRect(0, 0, W, H); })();
const MOTES = Array.from({ length: 240 }, () => ({ x: R() * W, y: R() * H, vx: (R() - .5) * 6, vy: -2 - R() * 5, s: .4 + R() * 1.1, ph: R() * 6.28, tw: .5 + R() * 2, a: .08 + R() * .28 }));

const SANS = '"Avenir Next", "Helvetica Neue", sans-serif', MONO = 'ui-monospace, Menlo, monospace';
function text(str, x, y, font, color, a, opts = {}) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.font = font; ctx.fillStyle = color; ctx.textAlign = opts.align || 'left'; ctx.textBaseline = opts.base || 'alphabetic';
  ctx.letterSpacing = (opts.ls || 0) + 'px'; if (opts.glow) { ctx.shadowColor = opts.glow; ctx.shadowBlur = opts.blur || 16; }
  ctx.fillText(str, x + (opts.align === 'center' ? (opts.ls || 0) / 2 : 0), y); ctx.restore();
}
